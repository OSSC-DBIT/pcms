# Development stack. Usage:
#   docker compose -f compose.dev.yml up --build
# Default host ports (change them in .env):
#   PWA (Vite HMR) http://localhost:5173 (PCMS_WEB_PORT)    API http://localhost:8000 (PCMS_API_PORT)
#   Mailpit UI     http://localhost:8025 (PCMS_MAIL_PORT)
#   nginx (--profile nginx) http://localhost:8080 (PCMS_HTTP_PORT), webhooks 8081 (PCMS_PUBLIC_PORT)
# The database login comes from PCMS_DB_NAME, PCMS_DB_USER and PCMS_DB_PASSWORD in .env.
name: pcms-dev

x-api-env: &api-env
  PCMS_ENV: dev
  PCMS_DB_HOST: db
  PCMS_DB_PORT: "5432"
  PCMS_DB_NAME: ${PCMS_DB_NAME:-pcms}
  PCMS_DB_USER: ${PCMS_DB_USER:-pcms}
  PCMS_DB_PASSWORD: ${PCMS_DB_PASSWORD:-pcms_dev}
  PCMS_PUBLIC_APP_URL: ${PCMS_PUBLIC_APP_URL:-http://localhost:${PCMS_HTTP_PORT:-8080}}
  PCMS_SECRET_KEY: dev-only-secret-key-change-me
  PCMS_CREDENTIAL_KEY: dev-only-credential-key-change-me
  PCMS_CLAMAV_REQUIRED: "false"
  PCMS_VAPID_PUBLIC_KEY: ${PCMS_VAPID_PUBLIC_KEY:-}
  PCMS_VAPID_PRIVATE_KEY: ${PCMS_VAPID_PRIVATE_KEY:-}
  PCMS_VAPID_SUBJECT: ${PCMS_VAPID_SUBJECT:-mailto:facilities@localhost}
  PCMS_MESSAGING_PROVIDER: ${PCMS_MESSAGING_PROVIDER:-none}
  PCMS_TRANSLATION_PROVIDER: ${PCMS_TRANSLATION_PROVIDER:-mymemory}
  PCMS_TRANSLATION_EMAIL: ${PCMS_TRANSLATION_EMAIL:-}
  PCMS_TRANSLATION_FALLBACK: ${PCMS_TRANSLATION_FALLBACK:-google}
  PCMS_TWILIO_ACCOUNT_SID: ${PCMS_TWILIO_ACCOUNT_SID:-}
  PCMS_TWILIO_AUTH_TOKEN: ${PCMS_TWILIO_AUTH_TOKEN:-}
  PCMS_TWILIO_WHATSAPP_FROM: ${PCMS_TWILIO_WHATSAPP_FROM:-}
  PCMS_TWILIO_SMS_FROM: ${PCMS_TWILIO_SMS_FROM:-}
  PCMS_TWILIO_JOB_CONTENT_SID: ${PCMS_TWILIO_JOB_CONTENT_SID:-}
  PCMS_PUBLIC_BASE_URL: ${PCMS_PUBLIC_BASE_URL:-http://localhost:${PCMS_PUBLIC_PORT:-8081}}
  WATCHFILES_FORCE_POLLING: "true"

# Everything else in .env (for example PCMS_ADMIN_1_EMAIL) also reaches the app containers.
# The values above win where both set the same name.
x-env-file: &env-file
  - path: .env
    required: false

services:
  db:
    image: postgres:17-alpine
    environment:
      # PostgreSQL applies these only when it first creates the pgdata volume.
      POSTGRES_USER: ${PCMS_DB_USER:-pcms}
      POSTGRES_PASSWORD: ${PCMS_DB_PASSWORD:-pcms_dev}
      POSTGRES_DB: ${PCMS_DB_NAME:-pcms}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCMS_DB_USER:-pcms} -d ${PCMS_DB_NAME:-pcms}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: dev }
    env_file: *env-file
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app
      - media:/data/media
    ports:
      - "127.0.0.1:${PCMS_API_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: { context: ./backend, target: dev }
    env_file: *env-file
    environment: *api-env
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - ./backend:/app
      - media:/data/media
    depends_on:
      api: { condition: service_started }
    profiles: ["jobs"]

  scheduler:
    build: { context: ./backend, target: dev }
    env_file: *env-file
    environment: *api-env
    command: ["python", "-m", "app.jobs.scheduler"]
    volumes:
      - ./backend:/app
    depends_on:
      api: { condition: service_started }
    profiles: ["jobs"]

  web:
    build: { context: ./frontend, target: dev }
    # node_modules lives in a container volume; reinstall whenever package-lock.json changes
    # (otherwise newly added packages such as qrcode are missing in the container).
    command: ["sh", "-c", "h=$$(sha256sum package-lock.json | cut -d' ' -f1); if [ \"$$(cat node_modules/.pcms-lock 2>/dev/null)\" != \"$$h\" ]; then npm ci && echo $$h > node_modules/.pcms-lock; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_USE_POLLING: "true"
      VITE_PROXY_TARGET: http://api:8000
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${PCMS_WEB_PORT:-5173}:5173"

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${PCMS_MAIL_PORT:-8025}:8025"

  nginx:
    build: { context: ., dockerfile: nginx/Dockerfile }
    ports:
      - "127.0.0.1:${PCMS_HTTP_PORT:-8080}:8080"
      # Webhooks and signed photos only. Point your own tunnel at http://127.0.0.1:${PCMS_PUBLIC_PORT}.
      - "127.0.0.1:${PCMS_PUBLIC_PORT:-8081}:8081"
    depends_on: [api]
    profiles: ["nginx"]

volumes:
  pgdata:
  media:
