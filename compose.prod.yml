# Production stack for the college server. See docs/DEPLOYMENT.md.
#   docker compose -f compose.prod.yml --env-file /srv/pcms/pcms.env up -d
# Only nginx publishes ports. PostgreSQL, the API, ClamAV and the jobs are on an
# internal network. The public listener (webhooks and signed photos only) is
# published on 127.0.0.1 so a tunnel you run on this host can reach it.
# The database login and every host port come from pcms.env.
name: pcms

x-app: &app
  image: ${PCMS_IMAGE_API:-pcms-api:release}
  build: { context: ./backend, target: prod }
  restart: unless-stopped
  env_file: ${PCMS_ENV_FILE:-./pcms.env}
  environment:
    PCMS_ENV: prod
    PCMS_DB_HOST: db
    PCMS_DB_PORT: "5432"
    PCMS_COOKIE_SECURE: "true"
    PCMS_CLAMAV_REQUIRED: "true"
    PCMS_MEDIA_ROOT: /data/media
    TZ: UTC
  volumes:
    - media:/data/media
  networks: [internal]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      # PostgreSQL applies these only when it first creates the pgdata volume.
      POSTGRES_USER: ${PCMS_DB_USER:-pcms}
      POSTGRES_DB: ${PCMS_DB_NAME:-pcms}
      POSTGRES_PASSWORD: ${PCMS_DB_PASSWORD:-}
      TZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCMS_DB_USER:-pcms} -d ${PCMS_DB_NAME:-pcms}"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "python -m app.cli check-config && alembic upgrade head && python -m app.cli seed"]
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [internal, egress]

  scheduler:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    networks: [internal, egress]  # egress only for signature updates (freshclam)
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s

  nginx:
    image: ${PCMS_IMAGE_WEB:-pcms-web:release}
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args: { NGINX_CONF: pcms-tls.conf }
    restart: unless-stopped
    ports:
      - "${PCMS_HTTP_PORT:-80}:8080"
      - "${PCMS_HTTPS_PORT:-443}:8443"
      # Webhooks and signed photos only. Run your tunnel to http://127.0.0.1:PCMS_PUBLIC_PORT.
      - "${PCMS_PUBLIC_BIND:-127.0.0.1}:${PCMS_PUBLIC_PORT:-8081}:8081"
    volumes:
      - ${PCMS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on: { api: { condition: service_healthy } }
    # Docker cannot publish ports from a container that is only on an internal
    # network, so nginx alone also joins the edge network.
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  backup:
    image: ${PCMS_IMAGE_BACKUP:-pcms-backup:release}
    build: { context: ./ops/backup }
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${PCMS_DB_USER:-pcms}
      PGDATABASE: ${PCMS_DB_NAME:-pcms}
      PGPASSWORD: ${PCMS_DB_PASSWORD:-}
      BACKUP_RECIPIENT_FILE: /run/secrets/backup_recipient
      BACKUP_DIR: /backups
      BACKUP_AT: ${PCMS_BACKUP_AT:-0130}
      TZ: Asia/Kolkata
    secrets: [backup_recipient]
    volumes:
      - media:/data/media:ro
      - ${PCMS_BACKUP_DIR:-./backups}:/backups
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]

networks:
  internal:
    internal: true
  egress: {}
  edge: {}

volumes:
  pgdata:
  media:
  clamdb:

secrets:
  backup_recipient:
    file: ${PCMS_SECRETS_DIR:-./secrets}/backup_recipient.txt
