# Production: HTTPS only. Certificates are mounted at /etc/nginx/certs (see docs/DEPLOYMENT.md).
include /etc/nginx/snippets/http.conf;

server {
    listen 8080;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pcms_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/app-locations.conf;
}

include /etc/nginx/snippets/public-listener.conf;
