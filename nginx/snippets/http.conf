# Resolve the api container at request time via Docker DNS, so a recreated
# api container (new IP) does not leave nginx returning 502.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

limit_req_zone $binary_remote_addr zone=pcms_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pcms_signin:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pcms_hooks:10m rate=30r/s;
limit_req_status 429;
