# Resolve the api container at request time via Docker DNS, so a recreated
# api container (new IP) does not leave nginx returning 502.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

# Cloudflare terminates TLS and forwards plain HTTP over the tunnel, so
# $scheme says "http" on that hop even though the browser used HTTPS. Report
# what the browser actually used, per listener.
map $server_port $pcms_forwarded_proto {
    default   $scheme;
    "8082"    "https";
}

# Rate limits count per visitor. On the campus listeners the peer is the
# visitor. On the tunnel listener $remote_addr is rewritten to the real
# visitor by the realip module (see tunnel-listener.conf), which runs in the
# post-read phase, before limit_req is evaluated here.
limit_req_zone $binary_remote_addr zone=pcms_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pcms_signin:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pcms_hooks:10m rate=30r/s;
limit_req_status 429;
