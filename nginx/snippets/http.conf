# Resolve the api container at request time via Docker DNS, so a recreated
# api container (new IP) does not leave nginx returning 502.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

limit_req_zone $binary_remote_addr zone=pcms_api:10m rate=20r/s;
# Only sign-in attempts (POST) count. Sign-out and session checks share the URL but must never be throttled:
# counting them is what made the browser test fail with a generic error after a few sign-in/out cycles.
map $request_method $pcms_signin_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $pcms_signin_key zone=pcms_signin:10m rate=30r/m;
limit_req_status 429;
