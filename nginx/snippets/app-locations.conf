# Campus-facing locations (PWA + API). Included by pcms.conf (HTTP, dev) and pcms-tls.conf (production).
set $pcms_api http://api:8000;
proxy_read_timeout 60s;
root /usr/share/nginx/html;
include /etc/nginx/snippets/security-headers.conf;

# Largest single upload is a 20 MB video, plus multipart overhead.
client_max_body_size 21m;

# CSV import hashes up to 1000 Argon2 passwords (about a minute).
location = /api/v1/admin/users/import {
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    proxy_pass $pcms_api;
}

location /api/ {
    limit_req zone=pcms_api burst=60 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $pcms_api;
}

location = /api/v1/session {
    limit_req zone=pcms_signin burst=10 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $pcms_api;
}

# Webhooks and signed media are served only on the tunnel listener.
location /webhooks/ { return 404; }
location /media/ { return 404; }

# Service worker and manifest must not be cached long, or updates stall.
location = /sw.js { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.conf; }

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
