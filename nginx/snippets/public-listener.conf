# Public listener for the tunnel you run yourself. Compose publishes it on
# 127.0.0.1:PCMS_PUBLIC_PORT (default 8081), so it is not open on the network by itself.
# Exposes exactly the Twilio webhooks and signed job-photo links; everything else is 404.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    set $pcms_api http://api:8000;
    client_max_body_size 64k;

    location ~ ^/webhooks/twilio(/status)?$ {
        limit_except POST { deny all; }
        limit_req zone=pcms_hooks burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $pcms_api;
    }

    location ~ "^/media/public/[A-Za-z0-9_.-]{20,120}$" {
        limit_except GET { deny all; }
        limit_req zone=pcms_hooks burst=50 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $pcms_api;
    }

    location / {
        return 404;
    }
}
