# App listener for the Cloudflare tunnel. Never published on the host: only the
# cloudflared container reaches it, over the internal Docker network.
#
# Cloudflare terminates TLS at its edge and forwards plain HTTP here, so this
# block serves the same app and API as the campus listener but without the
# HTTPS redirect that port 8080 does in production (that redirect would bounce
# the edge straight back into the tunnel).
server {
    listen 8082;
    server_name _;

    # Every request on this port arrives from the cloudflared container, so
    # $remote_addr would otherwise be one address shared by every visitor on
    # earth: one person failing sign-in five times would throttle everyone.
    # Cloudflare sets CF-Connecting-IP itself and strips any the client sent,
    # so recover the real address from it and let it replace $remote_addr for
    # rate limits, sign-in throttling, proxy headers and the access log.
    #
    # The trusted ranges are the private Docker networks this listener lives
    # on. They are safe to trust here precisely because port 8082 is never
    # published: nothing outside the compose network can open a connection to
    # it, so no untrusted peer is in a position to send the header. The campus
    # listeners do not set this, so there a client-sent CF-Connecting-IP is
    # ignored and the peer address stands.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fd00::/8;
    real_ip_header CF-Connecting-IP;

    # The browser reached Cloudflare over HTTPS even though this hop is plain
    # HTTP, so HSTS is correct to send and the app is free to set Secure cookies.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/app-locations.conf;
}
