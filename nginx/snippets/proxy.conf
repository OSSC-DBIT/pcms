proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr is the visitor: the peer on the campus listeners, and the
# address realip recovered from CF-Connecting-IP on the tunnel listener.
# X-Forwarded-For is overwritten rather than appended to ($proxy_add_x_forwarded_for),
# so a client cannot prepend a forged address to the chain the API reads.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $pcms_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_buffering off;
proxy_request_buffering on;
